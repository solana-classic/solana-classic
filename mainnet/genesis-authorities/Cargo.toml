[package]
name = "classic-genesis-authorities"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
solana-genesis-config = { version = "=3.0.0", features = ["serde"] }
solana-stake-interface = { version = "=2.0.1", features = ["serde"] }
solana-vote-interface = { version = "=3.0.0", features = ["bincode"] }
bincode = "=1.3.3"
serde_json = "=1.0.142"
sha2 = "=0.10.9"

[dev-dependencies]
solana-account = "=3.0.0"
solana-cluster-type = "=3.0.0"

[profile.release]
lto = "thin"
debug = 0
