[package]
name = "classic-bridge-gated-program"
version = "0.3.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
classic-bridge-program = { path = "../program", features = ["no-entrypoint"] }
solana-program = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-loader-v3-interface = { version = "=6.1.0", features = ["bincode"] }
spl-token-2022 = { version = "=10.0.0", features = ["no-entrypoint"] }
borsh = { version = "=1.6.0", features = ["derive"] }
bincode = "=1.3.3"

[dev-dependencies]
litesvm = "=0.9.0"
solana-sdk = "=3.0.0"

[workspace]
