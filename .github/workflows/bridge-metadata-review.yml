name: Bridge metadata review
on:
  pull_request:
    paths:
      - 'bridge/mint-metadata*'
      - 'bridge/gated-native*'
      - 'bridge/gated-message-review*'
      - 'bridge/gated-claim-review-journal*'
      - 'bridge/gated-claim-accounts*'
      - 'bridge/rehearsal/drop-forwarded-submission*'
      - 'engine/rehearsal/gated_operation_fault_agave*'
      - 'bridge/GATED_CLAIM_FAULTS.md'
      - 'evidence/bridge-gated-claim-faults.json'
      - 'bridge/gated-claim-operation*'
      - 'bridge/test-fixtures/gated-operation.mjs'
      - 'bridge/rehearsal/gated-operation*'
      - 'engine/rehearsal/gated_operation_agave*'
      - 'bridge/GATED_CLAIM_OPERATION.md'
      - 'evidence/bridge-gated-claim-operation.json'
      - 'bridge/gated-claim-settlement*'
